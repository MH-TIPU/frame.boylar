<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624" role="img" aria-label="Nakshi kantha inspired cloth">
  <!-- A nakshi kantha ground: running-stitch field, a stitched border, lotus
       medallions in the corners and a row of kalka along the foot. The middle is
       left quiet so the banner's own text stays readable on top of it. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf6e7"/>
      <stop offset=".55" stop-color="#f6f0dd"/>
      <stop offset="1" stop-color="#eee6cf"/>
    </linearGradient>

    <!-- the kantha stitch itself: fine broken rows right across the cloth -->
    <pattern id="field" width="40" height="13" patternUnits="userSpaceOnUse">
      <path d="M0 6.5h40" stroke="#cdbc93" stroke-width="1.5" stroke-dasharray="9 7" opacity=".42"/>
      <path d="M20 13h40" stroke="#cdbc93" stroke-width="1.5" stroke-dasharray="9 7" opacity=".42"/>
    </pattern>

    <g id="bud">
      <path d="M0-10C4.5-5 4.5 5 0 10C-4.5 5-4.5-5 0-10Z"/>
      <path d="M-10 0C-5-4.5 5-4.5 10 0C5 4.5-5 4.5-10 0Z"/>
    </g>
    <pattern id="buds" width="150" height="150" patternUnits="userSpaceOnUse">
      <use href="#bud" x="38" y="38" fill="#b4452f" opacity=".13"/>
      <use href="#bud" x="113" y="113" fill="#2f5d7a" opacity=".11"/>
      <circle cx="113" cy="38" r="3" fill="#3f7a4a" opacity=".16"/>
      <circle cx="38" cy="113" r="3" fill="#c8922a" opacity=".16"/>
    </pattern>

    <!-- lotus medallion, drawn once and reused in each corner -->
    <g id="lotus" fill="none" stroke-linecap="round">
      <g stroke-dasharray="8 7">
        <circle r="28" stroke="#b4452f" stroke-width="2.6"/>
        <circle r="56" stroke="#2f5d7a" stroke-width="2.3"/>
        <circle r="92" stroke="#3f7a4a" stroke-width="2.1"/>
        <circle r="130" stroke="#c8922a" stroke-width="2"/>
        <circle r="172" stroke="#b4452f" stroke-width="1.9"/>
      </g>
      <g stroke="#b4452f" stroke-width="2.4" stroke-dasharray="7 6">
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(0)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(45)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(90)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(135)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(180)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(225)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(270)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(315)"/>
      </g>
      <g stroke="#2f5d7a" stroke-width="2" stroke-dasharray="6 6">
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(22.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(112.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(202.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(292.5)"/>
      </g>
    </g>

    <!-- kalka, the paisley that edges most kanthas -->
    <g id="kalka" fill="none" stroke-linecap="round">
      <path d="M0 0C34-8 58 16 52 50C46 80 10 94-12 74C-30 58-24 30-2 26C12 23 21 34 16 46"
            stroke="#b4452f" stroke-width="2.8" stroke-dasharray="8 7"/>
      <path d="M2 12C26 6 44 24 39 48C35 70 11 79-5 66C-18 55-13 35 3 33"
            stroke="#3f7a4a" stroke-width="2.2" stroke-dasharray="6 6"/>
      <circle cx="16" cy="46" r="4" fill="#c8922a" stroke="none"/>
    </g>
  </defs>

  <rect width="1640" height="624" fill="url(#cloth)"/>
  <rect width="1640" height="624" fill="url(#field)"/>
  <rect width="1640" height="624" fill="url(#buds)"/>

  <!-- medallions tucked into the corners, cropped by the edge like a real kantha -->
  <g opacity=".3">
    <use href="#lotus" transform="translate(40 60)"/>
    <use href="#lotus" transform="translate(1600 60)"/>
    <use href="#lotus" transform="translate(60 600)"/>
    <use href="#lotus" transform="translate(1590 590)"/>
  </g>

  <!-- a line of kalka along the foot -->
  <g opacity=".26">
    <use href="#kalka" transform="translate(250 530)"/>
    <use href="#kalka" transform="translate(470 530) scale(-1 1)"/>
    <use href="#kalka" transform="translate(560 530)"/>
    <use href="#kalka" transform="translate(780 530) scale(-1 1)"/>
    <use href="#kalka" transform="translate(880 530)"/>
    <use href="#kalka" transform="translate(1100 530) scale(-1 1)"/>
  </g>

  <!-- stitched border, two rows with a run of dots between them -->
  <g fill="none" stroke-linecap="round">
    <rect x="15" y="15" width="1610" height="594" stroke="#b4452f" stroke-width="2.6" stroke-dasharray="11 9" opacity=".4"/>
    <rect x="31" y="31" width="1578" height="562" stroke="#3f7a4a" stroke-width="1.9" stroke-dasharray="7 7" opacity=".34"/>
    <rect x="44" y="44" width="1552" height="536" stroke="#2f5d7a" stroke-width="1.5" stroke-dasharray="4 9" opacity=".26"/>
  </g>
</svg>
