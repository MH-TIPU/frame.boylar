<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624" role="img" aria-label="Nakshi kantha inspired cloth">
  <!-- A nakshi kantha ground: running-stitch field, a stitched border, lotus
       medallions in the corners and a row of kalka along the foot. The middle is
       left quiet so the banner's own text stays readable on top of it. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf6e7"/>
      <stop offset=".55" stop-color="#f6f0dd"/>
      <stop offset="1" stop-color="#eee6cf"/>
    </linearGradient>

    <!-- the kantha stitch itself: fine broken rows right across the cloth -->
    <pattern id="field" width="40" height="13" patternUnits="userSpaceOnUse">
      <path d="M0 6.5h40" stroke="#cdbc93" stroke-width="1.4" stroke-dasharray="9 7" opacity=".12"/>
      <path d="M20 13h40" stroke="#cdbc93" stroke-width="1.4" stroke-dasharray="9 7" opacity=".12"/>
    </pattern>

    <g id="bud">
      <path d="M0-10C4.5-5 4.5 5 0 10C-4.5 5-4.5-5 0-10Z"/>
      <path d="M-10 0C-5-4.5 5-4.5 10 0C5 4.5-5 4.5-10 0Z"/>
    </g>
    <pattern id="buds" width="150" height="150" patternUnits="userSpaceOnUse">
      <use href="#bud" x="38" y="38" fill="#b4452f" opacity=".04"/>
      <use href="#bud" x="113" y="113" fill="#2f5d7a" opacity=".035"/>
      <circle cx="113" cy="38" r="3" fill="#3f7a4a" opacity=".05"/>
      <circle cx="38" cy="113" r="3" fill="#c8922a" opacity=".05"/>
    </pattern>

    <!-- lotus medallion, drawn once and reused in each corner -->
    <g id="lotus" fill="none" stroke-linecap="round">
      <g stroke-dasharray="8 7">
        <circle r="28" stroke="#b4452f" stroke-width="2.6"/>
        <circle r="56" stroke="#2f5d7a" stroke-width="2.3"/>
        <circle r="92" stroke="#3f7a4a" stroke-width="2.1"/>
        <circle r="130" stroke="#c8922a" stroke-width="2"/>
        <circle r="172" stroke="#b4452f" stroke-width="1.9"/>
      </g>
      <g stroke="#b4452f" stroke-width="2.4" stroke-dasharray="7 6">
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(0)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(45)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(90)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(135)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(180)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(225)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(270)"/>
        <path d="M0-28C12-46 12-66 0-84C-12-66-12-46 0-28Z" transform="rotate(315)"/>
      </g>
      <g stroke="#2f5d7a" stroke-width="2" stroke-dasharray="6 6">
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(22.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(112.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(202.5)"/>
        <path d="M0-92C16-110 16-134 0-152C-16-134-16-110 0-92Z" transform="rotate(292.5)"/>
      </g>
    </g>

    <!-- মাছ: the fish every kantha carries -->
    <g id="fish" fill="none" stroke-linecap="round">
      <path d="M0 0C14-17 44-17 58 0C44 17 14 17 0 0Z" stroke="#2f5d7a" stroke-width="2.6" stroke-dasharray="7 6"/>
      <path d="M58 0L78-13V13Z" stroke="#2f5d7a" stroke-width="2.4" stroke-dasharray="6 5"/>
      <path d="M22-11C28-3 28 3 22 11M34-12C40-3 40 3 34 12" stroke="#b4452f" stroke-width="2" stroke-dasharray="5 5"/>
      <circle cx="13" cy="-3" r="2.6" fill="#b4452f" stroke="none"/>
    </g>

    <!-- কল কারখানা: a saw-tooth shed and its chimney -->
    <g id="mill" fill="none" stroke-linecap="round" stroke-dasharray="7 6">
      <path d="M0 62V28L16 12V28L32 12V28L48 12V28L64 12V62H0Z" stroke="#3f7a4a" stroke-width="2.6"/>
      <path d="M74 62V20h13v42" stroke="#b4452f" stroke-width="2.4"/>
      <path d="M80 14C87 7 74 3 81-6" stroke="#2f5d7a" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="M10 42h11M27 42h11M44 42h11" stroke="#c8922a" stroke-width="2.2" stroke-dasharray="4 4"/>
    </g>

    <!-- ছোট দোকান: a little shop front under its awning -->
    <g id="shop" fill="none" stroke-linecap="round" stroke-dasharray="7 6">
      <path d="M5 58V28h54v30Z" stroke="#b4452f" stroke-width="2.6"/>
      <path d="M0 28L11 10h42l11 18Z" stroke="#3f7a4a" stroke-width="2.4"/>
      <path d="M17 28 21 10M32 28 32 10M47 28 43 10" stroke="#c8922a" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M5 46h54" stroke="#2f5d7a" stroke-width="2.2"/>
      <circle cx="20" cy="39" r="4" stroke="#2f5d7a" stroke-width="1.8"/>
      <circle cx="32" cy="39" r="4" stroke="#2f5d7a" stroke-width="1.8"/>
      <circle cx="44" cy="39" r="4" stroke="#2f5d7a" stroke-width="1.8"/>
    </g>

    <!-- মাটির হাঁড়ি: the potter's trade -->
    <g id="pot" fill="none" stroke-linecap="round" stroke-dasharray="6 5">
      <path d="M15 15C3 23-3 41 3 53C9 65 35 65 41 53C47 41 41 23 29 15Z" stroke="#b4452f" stroke-width="2.4"/>
      <path d="M11 13h22" stroke="#3f7a4a" stroke-width="2.4"/>
      <path d="M4 35h36" stroke="#c8922a" stroke-width="2"/>
    </g>

    <!-- ঝুড়ি: cane and bamboo work -->
    <g id="basket" fill="none" stroke-linecap="round" stroke-dasharray="6 5">
      <path d="M2 19h46l-7 34H9Z" stroke="#c8922a" stroke-width="2.4"/>
      <path d="M11 19C11 4 39 4 39 19" stroke="#3f7a4a" stroke-width="2.2"/>
      <path d="M6 31h38M10 42h30" stroke="#b4452f" stroke-width="1.8"/>
    </g>

    <!-- সেলাই মেশিন: the tailor's shop -->
    <g id="sewing" fill="none" stroke-linecap="round" stroke-dasharray="6 5">
      <path d="M2 48h58" stroke="#2f5d7a" stroke-width="2.6"/>
      <path d="M9 48V35h13v13" stroke="#3f7a4a" stroke-width="2.2"/>
      <path d="M9 35C9 15 21 11 35 11h15v11H37c-8 0-11 6-11 13" stroke="#b4452f" stroke-width="2.4"/>
      <path d="M45 22v13" stroke="#c8922a" stroke-width="2.2"/>
    </g>

    <!-- kalka, the paisley that edges most kanthas -->
    <g id="kalka" fill="none" stroke-linecap="round">
      <path d="M0 0C34-8 58 16 52 50C46 80 10 94-12 74C-30 58-24 30-2 26C12 23 21 34 16 46"
            stroke="#b4452f" stroke-width="2.8" stroke-dasharray="8 7"/>
      <path d="M2 12C26 6 44 24 39 48C35 70 11 79-5 66C-18 55-13 35 3 33"
            stroke="#3f7a4a" stroke-width="2.2" stroke-dasharray="6 6"/>
      <circle cx="16" cy="46" r="4" fill="#c8922a" stroke="none"/>
    </g>
  </defs>

  <rect width="1640" height="624" fill="url(#cloth)"/>
  <rect width="1640" height="624" fill="url(#field)"/>
  <rect width="1640" height="624" fill="url(#buds)"/>

  <!-- medallions tucked into the corners, cropped by the edge like a real kantha -->
  <g opacity=".08">
    <use href="#lotus" transform="translate(40 60)"/>
    <use href="#lotus" transform="translate(1600 60)"/>
    <use href="#lotus" transform="translate(60 600)"/>
    <use href="#lotus" transform="translate(1590 590)"/>
  </g>

  <!-- the small industry and trade this fair is for, scattered over the cloth the way
       a kantha carries fish, boats and houses. Faint enough to sit under the text. -->
  <g opacity=".055">
    <use href="#basket" transform="translate(96 128)"/>
    <use href="#sewing" transform="translate(300 134)"/>
    <use href="#pot" transform="translate(540 126)"/>
    <use href="#fish" transform="translate(760 150)"/>
    <use href="#mill" transform="translate(980 124)"/>
    <use href="#shop" transform="translate(1250 128)"/>
    <use href="#basket" transform="translate(1480 132)"/>

    <use href="#fish" transform="translate(70 290)"/>
    <use href="#pot" transform="translate(250 272)"/>
    <use href="#mill" transform="translate(450 268)"/>
    <use href="#basket" transform="translate(690 272)"/>
    <use href="#sewing" transform="translate(860 282)"/>
    <use href="#fish" transform="translate(1120 300) scale(-1 1)"/>
    <use href="#pot" transform="translate(1320 272)"/>
    <use href="#shop" transform="translate(1490 270)"/>

    <use href="#mill" transform="translate(120 400)"/>
    <use href="#fish" transform="translate(370 428)"/>
    <use href="#shop" transform="translate(560 404)"/>
    <use href="#basket" transform="translate(790 406)"/>
    <use href="#sewing" transform="translate(1040 408)"/>
    <use href="#pot" transform="translate(1290 402)"/>
    <use href="#fish" transform="translate(1540 428) scale(-1 1)"/>
  </g>

  <!-- a denser procession along the foot, where nothing else sits -->
  <g opacity=".1">
    <use href="#shop" transform="translate(96 522)"/>
    <use href="#fish" transform="translate(200 552)"/>
    <use href="#mill" transform="translate(320 518)"/>
    <use href="#pot" transform="translate(470 524)"/>
    <use href="#fish" transform="translate(620 552) scale(-1 1)"/>
    <use href="#basket" transform="translate(640 526)"/>
    <use href="#sewing" transform="translate(790 528)"/>
    <use href="#kalka" transform="translate(940 516)"/>
    <use href="#fish" transform="translate(1060 552)"/>
    <use href="#mill" transform="translate(1180 518)"/>
    <use href="#pot" transform="translate(1340 524)"/>
  </g>


  <!-- The banner leaves three places bare: the margin down each side and the gap through
       the middle, where a phone lays the page's profile photo. Nothing is set there, so the
       trades this fair is for are drawn properly rather than ghosted - still stitch-work,
       but dark enough to see: workshops, stalls, pots, cane and cloth. -->
  <g opacity=".24">
    <!-- left margin -->
    <use href="#shop" transform="translate(26 186) scale(1.2)"/>
    <use href="#mill" transform="translate(160 182) scale(1.1)"/>
    <use href="#pot" transform="translate(280 196) scale(1.1)"/>
    <use href="#basket" transform="translate(40 300) scale(1.2)"/>
    <use href="#sewing" transform="translate(166 296) scale(1.15)"/>
    <use href="#fish" transform="translate(276 318) scale(1.2)"/>
    <use href="#fish" transform="translate(22 418) scale(1.2) "/>
    <use href="#shop" transform="translate(140 404) scale(1.2)"/>
    <use href="#basket" transform="translate(272 410) scale(1.1)"/>
    <use href="#mill" transform="translate(40 512) scale(1.2)"/>
    <use href="#pot" transform="translate(186 520) scale(1.15)"/>
    <use href="#sewing" transform="translate(276 528) scale(1)"/>

    <!-- the middle, where the profile photo sits on a phone -->
    <use href="#mill" transform="translate(636 178) scale(1.2)"/>
    <use href="#shop" transform="translate(792 172) scale(1.2)"/>
    <use href="#pot" transform="translate(944 186) scale(1.2)"/>
    <use href="#basket" transform="translate(644 300) scale(1.2)"/>
    <use href="#sewing" transform="translate(794 296) scale(1.2)"/>
    <use href="#fish" transform="translate(938 318) scale(1.2)"/>
    <use href="#fish" transform="translate(640 428) scale(1.2)"/>
    <use href="#mill" transform="translate(786 414) scale(1.2)"/>
    <use href="#basket" transform="translate(948 420) scale(1.1)"/>
    <use href="#shop" transform="translate(654 524) scale(1.1)"/>
    <use href="#pot" transform="translate(812 530) scale(1.1)"/>
    <use href="#sewing" transform="translate(944 536) scale(1)"/>

    <!-- right margin -->
    <use href="#pot" transform="translate(1524 190) scale(1.1)"/>
    <use href="#fish" transform="translate(1512 304) scale(1.2)"/>
    <use href="#basket" transform="translate(1528 404) scale(1.1)"/>
    <use href="#shop" transform="translate(1518 512) scale(1)"/>
  </g>

  <!-- stitched border, two rows with a run of dots between them -->
  <g fill="none" stroke-linecap="round">
    <rect x="15" y="15" width="1610" height="594" stroke="#b4452f" stroke-width="2.4" stroke-dasharray="11 9" opacity=".14"/>
    <rect x="31" y="31" width="1578" height="562" stroke="#3f7a4a" stroke-width="1.8" stroke-dasharray="7 7" opacity=".11"/>
    <rect x="44" y="44" width="1552" height="536" stroke="#2f5d7a" stroke-width="1.4" stroke-dasharray="4 9" opacity=".08"/>
  </g>
</svg>
